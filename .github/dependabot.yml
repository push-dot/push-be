# Actions are pinned by commit SHA and images by digest; this keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /services/ai
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories: [/infra, /infra/vps]
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /services/ai
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
