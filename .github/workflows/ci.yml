name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Tests run on pull requests and on pushes to develop and main.
# Path filters skip a service when the diff does not touch it.
# A push to DEPLOY_BRANCH (default main) still runs every service
# before deploy. Deploys run only for that branch.
# The VPS image deploys on every push to that branch, before core
# and the gateway.
# Set the repository variable DEPLOY_BRANCH to retarget CD. If the new
# branch is not develop or main, add it under on.push.branches as well.
# A push to develop deploys the test server instead (GitHub environment
# "staging": push-be-staging Workers, compose.staging.yaml on the VPS).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      gateway: ${{ steps.filter.outputs.gateway }}
      core: ${{ steps.filter.outputs.core }}
      db: ${{ steps.filter.outputs.db }}
      deploy: ${{ steps.filter.outputs.deploy }}
      stage: ${{ steps.filter.outputs.stage }}
      vps: ${{ steps.filter.outputs.vps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          else
            base="$BEFORE"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed
          match() { grep -Eq "$1" /tmp/changed; }
          ai=false
          gateway=false
          core=false
          db=false
          vps=false
          if match '^(services/ai/|packages/contracts/|\.github/workflows/ci\.yml)'; then ai=true; fi
          if match '^(services/gateway/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then gateway=true; fi
          if match '^(services/core-api/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then core=true; fi
          if match '^(db/|\.github/workflows/migrate\.yml|services/ai/scripts/migrate\.py|\.github/workflows/ci\.yml)'; then db=true; fi
          if match '^(services/ai/|infra/vps/|\.github/workflows/ci\.yml)'; then vps=true; fi
          deploy=false
          stage=production
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "develop" ] && [ "$DEPLOY_BRANCH" != "develop" ]; then
            stage=staging
          fi
          if [ "$EVENT_NAME" = "push" ] && { [ "$REF_NAME" = "$DEPLOY_BRANCH" ] || [ "$stage" = "staging" ]; }; then
            ai=true
            gateway=true
            core=true
            db=true
            deploy=true
          fi
          printf '%s\n' "ai=$ai" "gateway=$gateway" "core=$core" "db=$db" \
            "deploy=$deploy" "stage=$stage" "vps=$vps" >> "$GITHUB_OUTPUT"

  # 3.12 is the floor (requires-python, Workers); 3.15 is the VPS image (services/ai/Dockerfile).
  test-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.vps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Install dependencies
        working-directory: services/ai
        run: uv sync --locked --no-dev --extra test --python "${{ matrix.python }}"
      - name: Test
        working-directory: services/ai
        # Coverage is reported, not enforced.
        run: uv run --no-sync python -m pytest --cov=app --cov-report=term

  # Reports ruff and mypy findings without failing the build (the backlog is not fixed yet).
  lint-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Install dependencies
        working-directory: services/ai
        run: uv sync --locked --no-dev --extra local --extra test --group lint --python 3.15
      - name: ruff check
        working-directory: services/ai
        continue-on-error: true
        run: uv run --no-sync ruff check --statistics .
      - name: ruff format
        working-directory: services/ai
        continue-on-error: true
        run: uv run --no-sync ruff format --check .
      - name: mypy
        working-directory: services/ai
        continue-on-error: true
        run: uv run --no-sync mypy

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test gateway
        run: |
          npm ci
          npm run test:coverage -w push-be-front
          npm run typecheck -w push-be-front

  test-db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Install dependencies
        working-directory: services/ai
        # test: the services/ai suite runs below to capture its SQL.
        run: uv sync --locked --extra migrate --extra test --python 3.12
      - name: Apply migrations
        working-directory: services/ai
        env:
          DATABASE_URL: postgres://push:push@localhost:5432/push?sslmode=disable
          DB_DRIVER: asyncpg
          PG_TRANSPORT: tcp
          RUN_MIGRATIONS: "1"
        run: uv run --no-sync python scripts/migrate.py
      - name: Check schema invariants
        run: psql postgres://push:push@localhost:5432/push -v ON_ERROR_STOP=1 -f db/tests/schema_checks.sql
      # The core and gateway tests run on in-memory fakes that accept any SQL. Capture every
      # statement they send and PREPARE it here, on the migrated schema, so a parameter
      # type conflict or a missing column fails CI instead of production.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workers
        run: npm ci
      # BILLING_PG_URL: the billing money tests (core-api test/billing-money.test.ts, ai tests/test_credits_settle_pg.py) run on
      # this migrated schema here and skip elsewhere; -rs lists every ai skip, so a lost URL shows.
      - name: Capture SQL from the core, gateway and ai tests
        env:
          SQL_CAPTURE: ${{ runner.temp }}/sql.jsonl
          BILLING_PG_URL: postgres://push:push@localhost:5432/push
        run: |
          set -euo pipefail
          register="$GITHUB_WORKSPACE/scripts/sql-check/register.mjs"
          (cd services/core-api && node --expose-gc --experimental-strip-types --import "$register" --test 'test/**/*.ts')
          (cd services/gateway && node --experimental-strip-types --import "$register" --test 'test/**/*.ts')
          (cd services/ai && PYTHONPATH="$GITHUB_WORKSPACE/scripts/sql-check" uv run --no-sync pytest -q -rs -p sql_capture)
      # The retention purge on the migrated schema (skipped elsewhere); -rs prints a skip if the URL is lost.
      - name: Retention purge tests
        working-directory: services/ai
        env:
          RETENTION_PG_URL: postgres://push:push@localhost:5432/push
        run: uv run --no-sync python -m pytest -q -rs tests/test_retention_pg.py
      # Constant SQL is checked without a test. Every runtime-built call site and every
      # SQL-looking string must land in a checked statement, or the job fails.
      - name: Extract constant SQL and check coverage
        env:
          SITES: ${{ runner.temp }}/sites.jsonl
          FRAGMENTS: ${{ runner.temp }}/fragments.jsonl
        run: |
          set -euo pipefail
          node scripts/sql-check/extract-ts.mjs services/core-api/tsconfig.json services/gateway/tsconfig.json \
            > "$RUNNER_TEMP/static-ts.jsonl"
          (cd services/ai && uv run --no-sync python "$GITHUB_WORKSPACE/scripts/sql-check/extract-py.py" src) \
            > "$RUNNER_TEMP/static-py.jsonl"
          node scripts/sql-check/coverage.mjs --sites "$SITES" --fragments "$FRAGMENTS" \
            --checked "$RUNNER_TEMP/static-ts.jsonl" "$RUNNER_TEMP/static-py.jsonl" "$RUNNER_TEMP/sql.jsonl"
          cat "$RUNNER_TEMP/static-ts.jsonl" "$RUNNER_TEMP/static-py.jsonl" >> "$RUNNER_TEMP/sql.jsonl"
      - name: PREPARE every captured statement
        run: |
          # The pre-#198 terms upsert must still be rejected, or the check has stopped working.
          if node scripts/sql-check/prepare.mjs scripts/sql-check/known-bad.jsonl \
            | psql postgres://push:push@localhost:5432/push -q -v ON_ERROR_STOP=1 -f - >/dev/null 2>&1; then
            echo "::error::sql-check accepted a statement it must reject"
            exit 1
          fi
          node scripts/sql-check/prepare.mjs "$RUNNER_TEMP/sql.jsonl" --source "$RUNNER_TEMP/fragments.jsonl" "$RUNNER_TEMP/sites.jsonl" \
            | psql postgres://push:push@localhost:5432/push -v ON_ERROR_STOP=1 -f -

  test-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test core API
        run: |
          npm ci
          npm run test:coverage -w push-be-core
          npm run typecheck -w push-be-core

  bundle-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check core bundle
        working-directory: services/core-api
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-core

  bundle-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check gateway bundle
        working-directory: services/gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-front

  # Static checks for the VPS: shellcheck, `docker compose config`, and
  # bin/check-compose (no docker.sock, privileged, host namespaces or Dokploy).
  test-vps:
    needs: changes
    if: needs.changes.outputs.vps == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check infra/vps
        run: infra/vps/test/run.sh

  # harden.sh's log purge against the real logrotate, rsyslog, fail2ban and auditd of the VPS's
  # Ubuntu release. On a pull request the base's purge runs first and must fail if it lacks the fix.
  test-vps-logs:
    needs: changes
    if: needs.changes.outputs.vps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install the VPS log packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rsyslog logrotate fail2ban auditd
      - name: Purge logs with the real logrotate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          old=()
          if [ "$EVENT_NAME" = pull_request ]; then
            git show HEAD^1:infra/vps/harden.sh >"$RUNNER_TEMP/base-harden.sh"
            old=("$RUNNER_TEMP/base-harden.sh")
          fi
          sudo CI=true infra/vps/test/real-logrotate.sh "${old[@]}"

  deploy:
    needs: [changes, test-ai, test-gateway, test-core, test-db, test-vps, bundle-core, bundle-gateway]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.changes.result == 'success' &&
      (needs.test-ai.result == 'success' || needs.test-ai.result == 'skipped') &&
      (needs.test-gateway.result == 'success' || needs.test-gateway.result == 'skipped') &&
      (needs.test-core.result == 'success' || needs.test-core.result == 'skipped') &&
      (needs.test-db.result == 'success' || needs.test-db.result == 'skipped') &&
      (needs.test-vps.result == 'success' || needs.test-vps.result == 'skipped') &&
      (needs.bundle-core.result == 'success' || needs.bundle-core.result == 'skipped') &&
      (needs.bundle-gateway.result == 'success' || needs.bundle-gateway.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # staging overrides DATABASE_URL, the shared secrets, DEV_AUTH_TOKEN, AI_HOST,
    # DISPATCH_HOST and CORE_ORIGIN; everything else comes from the repository.
    environment: ${{ needs.changes.outputs.stage }}
    env:
      STAGE: ${{ needs.changes.outputs.stage }}
      # Empty for production; "--env staging" picks the staging Workers in wrangler.jsonc.
      WRANGLER_ENV: ${{ needs.changes.outputs.stage == 'staging' && '--env staging' || '' }}
    concurrency:
      group: deploy-${{ needs.changes.outputs.stage }}
      cancel-in-progress: false
    steps:
      # Fails before anything ships when a required secret or variable is
      # missing. Only presence is checked here, so no value enters this step.
      # GitHub forbids the GITHUB_ prefix, so the GitHub OAuth app lives in
      # GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET and is renamed below.
      - name: Check deploy secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VPS_HOST: ${{ secrets.VPS_HOST != '' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD != '' }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET != '' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET != '' }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET != '' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN != '' }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY != '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY != '' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET != '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET != '' }}
          AI_HOST: ${{ vars.AI_HOST != '' }}
          DISPATCH_HOST: ${{ vars.DISPATCH_HOST != '' }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID != '' }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID != '' }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO != '' }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA != '' }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY != '' }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VPS_HOST VPS_SSH_KEY \
            DATABASE_URL REDIS_PASSWORD AI_SHARED_SECRET INTERNAL_API_SECRET DISPATCH_SECRET \
            ADMIN_TOKEN TOKEN_ENCRYPTION_KEY OPENROUTER_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            GOOGLE_CLIENT_SECRET GH_OAUTH_CLIENT_SECRET AI_HOST DISPATCH_HOST GOOGLE_CLIENT_ID \
            GH_OAUTH_CLIENT_ID STRIPE_PRICE_PRO STRIPE_PRICE_ULTRA VPS_SSH_HOST_KEY; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Deploy configuration missing::Set these GitHub Actions secrets or variables (see infra/vps/README.md): ${missing[*]}"
            exit 1
          fi
          echo "All required deploy secrets and variables are set."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install gateway
        run: npm ci
      # Uploads the script and wrangler vars. Each "Set ... secrets" step
      # writes its Worker's secrets from GitHub with `wrangler secret bulk`
      # (empty optional values are skipped; other existing secrets persist).
      # The VPS image deploys on every push to DEPLOY_BRANCH, then core,
      # then the gateway. The public workers.dev name stays `push-be`.
      - name: Deploy AI service to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Public host key printed by harden.sh. Required: a scanned key would trust whoever answers.
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}
          STAGING_AI_HOST: ${{ vars.STAGING_AI_HOST }}
          STAGING_DISPATCH_HOST: ${{ vars.STAGING_DISPATCH_HOST }}
          AI_HOST: ${{ vars.AI_HOST }}
          DISPATCH_HOST: ${{ vars.DISPATCH_HOST }}
          CORE_ORIGIN: ${{ vars.CORE_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA }}
          QUEUE_BACKEND: ${{ vars.QUEUE_BACKEND }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
          EMBEDDING_API_MODEL: ${{ vars.EMBEDDING_API_MODEL }}
          RERANK_PROVIDER: ${{ vars.RERANK_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          NEON_STORAGE_LIMIT_BYTES: ${{ vars.NEON_STORAGE_LIMIT_BYTES }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          AI_WORKER_CONCURRENCY: ${{ vars.AI_WORKER_CONCURRENCY }}
          INGEST_WORKER_CONCURRENCY: ${{ vars.INGEST_WORKER_CONCURRENCY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%b\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          # The deploy key is pinned to push-deploy on the VPS; each call is one verb.
          ssh_vps() {
            ssh -i ~/.ssh/id_vps \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ControlMaster=auto \
              -o ControlPath="$HOME/.ssh/cm-%C" \
              -o ControlPersist=300 \
              "deploy@${VPS_HOST}" "$@"
          }
          # /opt/push-be/.env is rebuilt from GitHub on every deploy (0600, owned
          # by deploy). Values are written single-quoted and never printed.
          env_file="$RUNNER_TEMP/push-be.env"
          trap 'rm -f "$env_file"' EXIT
          jq -nr '
            env
            | {DATABASE_URL, REDIS_PASSWORD, AI_SHARED_SECRET, INTERNAL_API_SECRET, DISPATCH_SECRET,
               ADMIN_TOKEN, TOKEN_ENCRYPTION_KEY, OPENROUTER_API_KEY, EMBEDDING_API_KEY,
               STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_SECRET,
               GITHUB_CLIENT_SECRET: .GH_OAUTH_CLIENT_SECRET, RESEND_API_KEY,
               DISCORD_ALERT_WEBHOOK_URL, EXPO_ACCESS_TOKEN, DEV_AUTH_TOKEN, STAGING_AI_HOST,
               STAGING_DISPATCH_HOST, AI_HOST, DISPATCH_HOST, CORE_ORIGIN,
               GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID: .GH_OAUTH_CLIENT_ID, STRIPE_PRICE_PRO,
               STRIPE_PRICE_ULTRA, QUEUE_BACKEND, EMBEDDING_PROVIDER, EMBEDDING_API_MODEL,
               RERANK_PROVIDER, AI_BASE_URL, NEON_STORAGE_LIMIT_BYTES, ALERT_EMAIL_TO,
               ALERT_EMAIL_FROM, AI_WORKER_CONCURRENCY, INGEST_WORKER_CONCURRENCY}
            | to_entries[] | select((.value // "") != "")
            | if (.value | test("[\u0027\n\r]")) then error("\(.key) contains a quote or newline")
              else "\(.key)=\u0027\(.value)\u0027" end
          ' > "$env_file"
          # push-deploy takes "staging" before the verb for the test server.
          stage_arg=()
          [ "$STAGE" = "staging" ] && stage_arg=(staging)
          git archive --format=tar HEAD | ssh_vps "${stage_arg[@]}" release "$GITHUB_SHA"
          ssh_vps "${stage_arg[@]}" env < "$env_file"
          if ! ssh_vps "${stage_arg[@]}" up "$GITHUB_SHA"; then
            ssh_vps "${stage_arg[@]}" logs || true
            exit 1
          fi
          for url in "https://${AI_HOST}/healthz" "https://${DISPATCH_HOST}/healthz"; do
            ok=0
            for _ in $(seq 1 36); do
              code="$(curl -sS -o /tmp/healthz -w "%{http_code}" --max-time 15 "$url" || true)"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              echo "$url status=${code:-000}; retrying"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url did not return 200"
              cat /tmp/healthz >&2 || true
              ssh_vps "${stage_arg[@]}" ps || true
              exit 1
            fi
            echo "$url ok"
          done
      - name: Deploy core worker
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy $WRANGLER_ENV --var AI_ORIGIN:https://${{ vars.AI_HOST }}
      # OAuth client IDs and Stripe price IDs are not secret, but they are
      # stored as Worker secrets so `wrangler deploy` (which replaces plain
      # vars with wrangler.jsonc) never drops them.
      - name: Set core secrets
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA }}
          STRIPE_PRICE_EMPLOYER_BASIC: ${{ vars.STRIPE_PRICE_EMPLOYER_BASIC }}
          STRIPE_PRICE_EMPLOYER_PRO: ${{ vars.STRIPE_PRICE_EMPLOYER_PRO }}
          STRIPE_PRICE_EMPLOYER_ULTRA: ${{ vars.STRIPE_PRICE_EMPLOYER_ULTRA }}
          STRIPE_PRICE_TOPUP: ${{ vars.STRIPE_PRICE_TOPUP }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/secrets-core.json"
          jq -n 'env
                 | {DATABASE_URL, TOKEN_ENCRYPTION_KEY, AI_SHARED_SECRET, DISPATCH_SECRET, INTERNAL_API_SECRET,
                    STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_SECRET,
                    GITHUB_CLIENT_SECRET: .GH_OAUTH_CLIENT_SECRET, RESEND_API_KEY, GOOGLE_CLIENT_ID,
                    GITHUB_CLIENT_ID: .GH_OAUTH_CLIENT_ID, STRIPE_PRICE_PRO, STRIPE_PRICE_ULTRA,
                    STRIPE_PRICE_EMPLOYER_BASIC, STRIPE_PRICE_EMPLOYER_PRO, STRIPE_PRICE_EMPLOYER_ULTRA,
                    STRIPE_PRICE_TOPUP, DEV_AUTH_TOKEN}
                 | with_entries(select((.value // "") != ""))' >"$file"
          npx wrangler secret bulk "$file" $WRANGLER_ENV
          rm -f "$file"
      - name: Deploy gateway worker
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy $WRANGLER_ENV --var AI_ORIGIN:https://${{ vars.AI_HOST }}
      - name: Set gateway secrets
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/secrets-gateway.json"
          jq -n 'env | {DATABASE_URL, AI_SHARED_SECRET, INTERNAL_API_SECRET, DEV_AUTH_TOKEN}
                 | with_entries(select((.value // "") != ""))' >"$file"
          npx wrangler secret bulk "$file" $WRANGLER_ENV
          rm -f "$file"
