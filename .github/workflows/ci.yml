name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Tests run on pull requests and on pushes to develop and main.
# Path filters skip a service when the diff does not touch it.
# A push to DEPLOY_BRANCH (default main) still runs every service
# before deploy. Deploys run only for that branch.
# The VPS image is the exception: it deploys only when services/ai or
# infra/vps changed, after the Python Worker and before core.
# Set the repository variable DEPLOY_BRANCH to retarget CD. If the new
# branch is not develop or main, add it under on.push.branches as well.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      gateway: ${{ steps.filter.outputs.gateway }}
      core: ${{ steps.filter.outputs.core }}
      db: ${{ steps.filter.outputs.db }}
      deploy: ${{ steps.filter.outputs.deploy }}
      vps: ${{ steps.filter.outputs.vps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          else
            base="$BEFORE"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed
          match() { grep -Eq "$1" /tmp/changed; }
          ai=false
          gateway=false
          core=false
          db=false
          vps=false
          if match '^(services/ai/|packages/contracts/|\.github/workflows/ci\.yml)'; then ai=true; fi
          if match '^(services/gateway/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then gateway=true; fi
          if match '^(services/core-api/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then core=true; fi
          if match '^(db/|\.github/workflows/migrate\.yml|services/ai/scripts/migrate\.py|\.github/workflows/ci\.yml)'; then db=true; fi
          if match '^(services/ai/|infra/vps/)'; then vps=true; fi
          deploy=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "$DEPLOY_BRANCH" ]; then
            ai=true
            gateway=true
            core=true
            db=true
            deploy=true
          fi
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "vps=$vps" >> "$GITHUB_OUTPUT"

  test-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.vps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install dependencies
        working-directory: services/ai
        run: python -m pip install -e ".[test]"
      - name: Test
        working-directory: services/ai
        run: python -m pytest

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test gateway
        run: |
          npm ci
          npm test -w push-be-front
          npx tsc -p services/gateway --noEmit

  test-db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install dependencies
        working-directory: services/ai
        run: python -m pip install -e . 'asyncpg>=0.30'
      - name: Apply migrations
        working-directory: services/ai
        env:
          DATABASE_URL: postgres://push:push@localhost:5432/push?sslmode=disable
          DB_DRIVER: asyncpg
          PG_TRANSPORT: tcp
          RUN_MIGRATIONS: "1"
        run: python scripts/migrate.py

  bundle-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Install Workers tooling
        working-directory: services/ai
        run: uv sync --group dev --python 3.12
      - name: Check Python worker bundle
        working-directory: services/ai
        run: |
          uv run pywrangler deploy --dry-run --outdir /tmp/push-be-bundle
          python3 scripts/check_worker_bundle.py /tmp/push-be-bundle

  test-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test core API
        run: |
          npm ci
          npm test -w push-be-core
          npx tsc -p services/core-api --noEmit

  bundle-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check core bundle
        working-directory: services/core-api
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-core

  bundle-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check gateway bundle
        working-directory: services/gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-front

  deploy:
    needs: [changes, test-ai, test-gateway, test-core, test-db, bundle-ai, bundle-core, bundle-gateway]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.changes.result == 'success' &&
      (needs.test-ai.result == 'success' || needs.test-ai.result == 'skipped') &&
      (needs.test-gateway.result == 'success' || needs.test-gateway.result == 'skipped') &&
      (needs.test-core.result == 'success' || needs.test-core.result == 'skipped') &&
      (needs.test-db.result == 'success' || needs.test-db.result == 'skipped') &&
      (needs.bundle-ai.result == 'success' || needs.bundle-ai.result == 'skipped') &&
      (needs.bundle-core.result == 'success' || needs.bundle-core.result == 'skipped') &&
      (needs.bundle-gateway.result == 'success' || needs.bundle-gateway.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-${{ vars.DEPLOY_BRANCH || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Install Workers tooling
        working-directory: services/ai
        run: uv sync --group dev --python 3.12
      - name: Install gateway
        run: npm ci
      # Uploads the script and wrangler vars. Existing Worker secrets
      # persist. The core step below writes DATABASE_URL and
      # BYOK_MASTER_KEY only when those GitHub secrets are non-empty.
      # Python worker first, then the VPS image when services/ai or
      # infra/vps changed, then core, then the gateway. Each service
      # binding needs its target to exist. The public workers.dev name
      # stays `push-be`.
      - name: Deploy Python worker
        working-directory: services/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
      - name: Deploy AI service to VPS
        if: needs.changes.outputs.vps == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HEALTH_URL: https://ai.187-127-112-169.sslip.io/healthz
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "VPS_HOST and VPS_SSH_KEY must be set on the repository"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          umask 077
          printf '%b\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh_vps() {
            ssh -i ~/.ssh/id_vps \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "root@${VPS_HOST}" "$@"
          }
          ssh_vps "mkdir -p /opt/push-be && if [ -f /opt/push-be/.env ]; then cp -a /opt/push-be/.env /tmp/push-be.env.keep; fi"
          git archive --format=tar HEAD | ssh_vps "tar -x -C /opt/push-be"
          ssh_vps "set -euo pipefail
            if [ -f /tmp/push-be.env.keep ]; then mv /tmp/push-be.env.keep /opt/push-be/.env; fi
            if [ ! -f /opt/push-be/.env ]; then
              echo '/opt/push-be/.env is missing; refusing to deploy' >&2
              exit 1
            fi
            cd /opt/push-be
            set -a
            . ./.env
            set +a
            docker compose -p push-ai -f infra/vps/compose.yaml up -d --build"
          ok=0
          for _ in $(seq 1 36); do
            code="$(curl -sS -o /tmp/healthz -w "%{http_code}" --max-time 15 "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "healthz status=${code:-000}; retrying"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "healthz did not return 200: $HEALTH_URL" >&2
            cat /tmp/healthz >&2 || true
            exit 1
          fi
          echo "healthz ok"
      - name: Deploy core worker
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set core secrets
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          for name in DATABASE_URL BYOK_MASTER_KEY AI_SHARED_SECRET DISPATCH_SECRET INTERNAL_API_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done
      - name: Deploy gateway worker
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set gateway secrets
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -n "${INTERNAL_API_SECRET}" ]; then
            printf '%s' "$INTERNAL_API_SECRET" | npx wrangler secret put INTERNAL_API_SECRET
          fi
