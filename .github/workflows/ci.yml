name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Tests run on pull requests and on pushes to develop and main.
# Path filters skip a service when the diff does not touch it.
# A push to DEPLOY_BRANCH (default main) still runs every service
# before deploy. Deploys run only for that branch.
# The VPS image is the exception: it deploys only when services/ai or
# infra/vps changed, after the Python Worker and before core.
# Set the repository variable DEPLOY_BRANCH to retarget CD. If the new
# branch is not develop or main, add it under on.push.branches as well.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      gateway: ${{ steps.filter.outputs.gateway }}
      core: ${{ steps.filter.outputs.core }}
      db: ${{ steps.filter.outputs.db }}
      deploy: ${{ steps.filter.outputs.deploy }}
      vps: ${{ steps.filter.outputs.vps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          else
            base="$BEFORE"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed
          match() { grep -Eq "$1" /tmp/changed; }
          ai=false
          gateway=false
          core=false
          db=false
          vps=false
          if match '^(services/ai/|packages/contracts/|\.github/workflows/ci\.yml)'; then ai=true; fi
          if match '^(services/gateway/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then gateway=true; fi
          if match '^(services/core-api/|packages/contracts/|package\.json|package-lock\.json|\.github/workflows/ci\.yml)'; then core=true; fi
          if match '^(db/|\.github/workflows/migrate\.yml|services/ai/scripts/migrate\.py|\.github/workflows/ci\.yml)'; then db=true; fi
          if match '^(services/ai/|infra/vps/|\.github/workflows/ci\.yml)'; then vps=true; fi
          deploy=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "$DEPLOY_BRANCH" ]; then
            ai=true
            gateway=true
            core=true
            db=true
            deploy=true
          fi
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "vps=$vps" >> "$GITHUB_OUTPUT"

  test-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.vps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install dependencies
        working-directory: services/ai
        run: python -m pip install -e ".[test]"
      - name: Test
        working-directory: services/ai
        run: python -m pytest

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test gateway
        run: |
          npm ci
          npm test -w push-be-front
          npx tsc -p services/gateway --noEmit

  test-db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: push
          POSTGRES_DB: push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U push -d push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install dependencies
        working-directory: services/ai
        run: python -m pip install -e . 'asyncpg>=0.30'
      - name: Apply migrations
        working-directory: services/ai
        env:
          DATABASE_URL: postgres://push:push@localhost:5432/push?sslmode=disable
          DB_DRIVER: asyncpg
          PG_TRANSPORT: tcp
          RUN_MIGRATIONS: "1"
        run: python scripts/migrate.py

  bundle-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Install Workers tooling
        working-directory: services/ai
        run: uv sync --group dev --python 3.12
      - name: Check Python worker bundle
        working-directory: services/ai
        run: |
          uv run pywrangler deploy --dry-run --outdir /tmp/push-be-bundle
          python3 scripts/check_worker_bundle.py /tmp/push-be-bundle

  test-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test core API
        run: |
          npm ci
          npm test -w push-be-core
          npx tsc -p services/core-api --noEmit

  bundle-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check core bundle
        working-directory: services/core-api
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-core

  bundle-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Check gateway bundle
        working-directory: services/gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/push-be-front

  # Static checks for the VPS: shellcheck, `docker compose config`, and
  # bin/check-compose (no docker.sock, privileged, host namespaces or Dokploy).
  test-vps:
    needs: changes
    if: needs.changes.outputs.vps == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check infra/vps
        run: infra/vps/test/run.sh

  deploy:
    needs: [changes, test-ai, test-gateway, test-core, test-db, test-vps, bundle-ai, bundle-core, bundle-gateway]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.changes.result == 'success' &&
      (needs.test-ai.result == 'success' || needs.test-ai.result == 'skipped') &&
      (needs.test-gateway.result == 'success' || needs.test-gateway.result == 'skipped') &&
      (needs.test-core.result == 'success' || needs.test-core.result == 'skipped') &&
      (needs.test-db.result == 'success' || needs.test-db.result == 'skipped') &&
      (needs.test-vps.result == 'success' || needs.test-vps.result == 'skipped') &&
      (needs.bundle-ai.result == 'success' || needs.bundle-ai.result == 'skipped') &&
      (needs.bundle-core.result == 'success' || needs.bundle-core.result == 'skipped') &&
      (needs.bundle-gateway.result == 'success' || needs.bundle-gateway.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-${{ vars.DEPLOY_BRANCH || 'main' }}
      cancel-in-progress: false
    steps:
      # Fails before anything ships when a required secret or variable is
      # missing. Only presence is checked here, so no value enters this step.
      # GitHub forbids the GITHUB_ prefix, so the GitHub OAuth app lives in
      # GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET and is renamed below.
      - name: Check deploy secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VPS_HOST: ${{ secrets.VPS_HOST != '' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD != '' }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET != '' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET != '' }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET != '' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN != '' }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY != '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY != '' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET != '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET != '' }}
          AI_HOST: ${{ vars.AI_HOST != '' }}
          DISPATCH_HOST: ${{ vars.DISPATCH_HOST != '' }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID != '' }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID != '' }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO != '' }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA != '' }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VPS_HOST VPS_SSH_KEY \
            DATABASE_URL REDIS_PASSWORD AI_SHARED_SECRET INTERNAL_API_SECRET DISPATCH_SECRET \
            ADMIN_TOKEN BYOK_MASTER_KEY OPENROUTER_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            GOOGLE_CLIENT_SECRET GH_OAUTH_CLIENT_SECRET AI_HOST DISPATCH_HOST GOOGLE_CLIENT_ID \
            GH_OAUTH_CLIENT_ID STRIPE_PRICE_PRO STRIPE_PRICE_ULTRA; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Deploy configuration missing::Set these GitHub Actions secrets or variables (see infra/vps/README.md): ${missing[*]}"
            exit 1
          fi
          echo "All required deploy secrets and variables are set."
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Install Workers tooling
        working-directory: services/ai
        run: uv sync --group dev --python 3.12
      - name: Install gateway
        run: npm ci
      # Uploads the script and wrangler vars. Each "Set ... secrets" step
      # writes its Worker's secrets from GitHub with `wrangler secret bulk`
      # (empty optional values are skipped; other existing secrets persist).
      # Python worker first, then the VPS image when services/ai or
      # infra/vps changed, then core, then the gateway. Each service
      # binding needs its target to exist. The public workers.dev name
      # stays `push-be`.
      - name: Deploy Python worker
        working-directory: services/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
      # AI_SHARED_SECRET stays unset on this Worker: it is reached through a
      # service binding, and the shared-secret check is for VPS traffic only.
      - name: Set Python worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/secrets-python.json"
          jq -n '{DATABASE_URL: env.DATABASE_URL, BYOK_MASTER_KEY: env.BYOK_MASTER_KEY,
                  OPENROUTER_API_KEY: env.OPENROUTER_API_KEY, INTERNAL_API_SECRET: env.INTERNAL_API_SECRET}
                 | with_entries(select((.value // "") != ""))' >"$file"
          npx wrangler secret bulk "$file" --name push-be-python
          rm -f "$file"
      - name: Deploy AI service to VPS
        if: needs.changes.outputs.vps == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Public host key printed by harden.sh. Unset falls back to trust on first use.
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          AI_HOST: ${{ vars.AI_HOST }}
          DISPATCH_HOST: ${{ vars.DISPATCH_HOST }}
          CORE_ORIGIN: ${{ vars.CORE_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA }}
          QUEUE_BACKEND: ${{ vars.QUEUE_BACKEND }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
          EMBEDDING_API_MODEL: ${{ vars.EMBEDDING_API_MODEL }}
          RAG_ENGINE: ${{ vars.RAG_ENGINE }}
          RERANK_PROVIDER: ${{ vars.RERANK_PROVIDER }}
          AI_HARNESS: ${{ vars.AI_HARNESS }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          NEON_STORAGE_LIMIT_BYTES: ${{ vars.NEON_STORAGE_LIMIT_BYTES }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          AI_WORKER_CONCURRENCY: ${{ vars.AI_WORKER_CONCURRENCY }}
          INGEST_WORKER_CONCURRENCY: ${{ vars.INGEST_WORKER_CONCURRENCY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%b\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          if [ -n "$VPS_SSH_HOST_KEY" ]; then
            printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_SSH_HOST_KEY is not set; trusting the VPS host key on first use. Set it from the harden.sh output."
            ssh-keyscan -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          # The deploy key is pinned to push-deploy on the VPS; each call is one verb.
          ssh_vps() {
            ssh -i ~/.ssh/id_vps \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ControlMaster=auto \
              -o ControlPath="$HOME/.ssh/cm-%C" \
              -o ControlPersist=300 \
              "deploy@${VPS_HOST}" "$@"
          }
          # /opt/push-be/.env is rebuilt from GitHub on every deploy (0600, owned
          # by deploy). Values are written single-quoted and never printed.
          env_file="$RUNNER_TEMP/push-be.env"
          trap 'rm -f "$env_file"' EXIT
          jq -nr '
            env
            | {DATABASE_URL, REDIS_PASSWORD, AI_SHARED_SECRET, INTERNAL_API_SECRET, DISPATCH_SECRET,
               ADMIN_TOKEN, BYOK_MASTER_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY, EMBEDDING_API_KEY,
               STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_SECRET,
               GITHUB_CLIENT_SECRET: .GH_OAUTH_CLIENT_SECRET, RESEND_API_KEY,
               DISCORD_ALERT_WEBHOOK_URL, EXPO_ACCESS_TOKEN, AI_HOST, DISPATCH_HOST, CORE_ORIGIN,
               GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID: .GH_OAUTH_CLIENT_ID, STRIPE_PRICE_PRO,
               STRIPE_PRICE_ULTRA, QUEUE_BACKEND, EMBEDDING_PROVIDER, EMBEDDING_API_MODEL, RAG_ENGINE,
               RERANK_PROVIDER, AI_HARNESS, AI_BASE_URL, NEON_STORAGE_LIMIT_BYTES, ALERT_EMAIL_TO,
               ALERT_EMAIL_FROM, AI_WORKER_CONCURRENCY, INGEST_WORKER_CONCURRENCY}
            | to_entries[] | select((.value // "") != "")
            | if (.value | test("[\u0027\n\r]")) then error("\(.key) contains a quote or newline")
              else "\(.key)=\u0027\(.value)\u0027" end
          ' > "$env_file"
          git archive --format=tar HEAD | ssh_vps release "$GITHUB_SHA"
          ssh_vps env < "$env_file"
          if ! ssh_vps up "$GITHUB_SHA"; then
            ssh_vps logs || true
            exit 1
          fi
          for url in "https://${AI_HOST}/healthz" "https://${DISPATCH_HOST}/healthz"; do
            ok=0
            for _ in $(seq 1 36); do
              code="$(curl -sS -o /tmp/healthz -w "%{http_code}" --max-time 15 "$url" || true)"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              echo "$url status=${code:-000}; retrying"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url did not return 200"
              cat /tmp/healthz >&2 || true
              ssh_vps ps || true
              exit 1
            fi
            echo "$url ok"
          done
      - name: Deploy core worker
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      # OAuth client IDs and Stripe price IDs are not secret, but they are
      # stored as Worker secrets so `wrangler deploy` (which replaces plain
      # vars with wrangler.jsonc) never drops them.
      - name: Set core secrets
        working-directory: services/core-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ vars.STRIPE_PRICE_ULTRA }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/secrets-core.json"
          jq -n 'env
                 | {DATABASE_URL, BYOK_MASTER_KEY, AI_SHARED_SECRET, DISPATCH_SECRET, INTERNAL_API_SECRET,
                    STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_SECRET,
                    GITHUB_CLIENT_SECRET: .GH_OAUTH_CLIENT_SECRET, RESEND_API_KEY, GOOGLE_CLIENT_ID,
                    GITHUB_CLIENT_ID: .GH_OAUTH_CLIENT_ID, STRIPE_PRICE_PRO, STRIPE_PRICE_ULTRA}
                 | with_entries(select((.value // "") != ""))' >"$file"
          npx wrangler secret bulk "$file"
          rm -f "$file"
      - name: Deploy gateway worker
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set gateway secrets
        working-directory: services/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/secrets-gateway.json"
