name: Migrate database

# Manual only. Pushes to develop/main deploy the Worker and do not migrate.
# This job uses the GitHub secret DATABASE_URL. It does not call
# `wrangler secret put`, so Worker runtime secrets stay as they are.
#
# Default transport is websocket (Neon wss://<direct-host>/v2), so the
# job does not need outbound port 5432. Choose tcp when 5432 is open.
on:
  workflow_dispatch:
    inputs:
      transport:
        description: "tcp uses port 5432. websocket uses Neon wss://host/v2."
        type: choice
        required: true
        default: websocket
        options:
          - websocket
          - tcp

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      # The migrate extra (services/ai/pyproject.toml) adds asyncpg and websockets>=13,<17.
      - name: Install dependencies
        working-directory: services/ai
        run: uv sync --locked --no-dev --extra migrate --python 3.12
      - name: Apply migrations
        working-directory: services/ai
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_TRANSPORT: ${{ inputs.transport }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret DATABASE_URL is not set."
            exit 1
          fi
          case "$PG_TRANSPORT" in
            tcp|websocket) ;;
            *) echo "PG_TRANSPORT must be tcp or websocket." >&2; exit 1 ;;
          esac
          uv run --no-sync python scripts/migrate.py
