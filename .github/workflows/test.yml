name: API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: push
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U push -d push_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://push:local-test-only@localhost:5432/push_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /tmp/push-api .
      - run: docker build -t push-api:ci .
