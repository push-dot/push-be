# Local stack. Postgres matches the laptop port used by .env.example (5434).
# The AI side is two uvicorn services from one Dockerfile: push-bot (the consumer Bot, :8080) and
# push-agent (the enterprise agent, :8081). With no Redis each runs its in-process chat worker and
# claims only its own conversations: push-bot the personal ones, push-agent a company's.
# Migrations are mounted at /db so app.db.migrations_dir() finds them; push-bot applies them.
#
# The gateway Worker speaks Neon HTTP, not this Postgres wire protocol, so
# it is not a compose service. Run it with:
#   cd services/gateway && npx wrangler dev
# Routes the gateway does not handle still go to the Python Worker through
# the API service binding. Hit push-bot's uvicorn process on :8080 for those.

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_USER: push
      POSTGRES_PASSWORD: push
      POSTGRES_DB: push
    ports:
      - "5434:5432"
    volumes:
      - push-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d push"]
      interval: 5s
      timeout: 3s
      retries: 10

  push-bot:
    build:
      context: ../services/ai
      target: push-bot
    environment:
      DATABASE_URL: postgres://push:push@postgres:5432/push?sslmode=disable
      DB_DRIVER: asyncpg
      PG_TRANSPORT: tcp
      RUN_MIGRATIONS: "1"
      APP_ENV: development
      PYTHONPATH: /app/src
    ports:
      - "8080:8080"
    volumes:
      - ../db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy

  push-agent:
    build:
      context: ../services/ai
      target: push-agent
    environment:
      DATABASE_URL: postgres://push:push@postgres:5432/push?sslmode=disable
      DB_DRIVER: asyncpg
      PG_TRANSPORT: tcp
      RUN_MIGRATIONS: "0"
      APP_ENV: development
      PYTHONPATH: /app/src
    ports:
      - "8081:8080"
    depends_on:
      push-bot:
        condition: service_healthy

volumes:
  push-pgdata:
