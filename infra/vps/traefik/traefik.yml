# Static config. No Docker provider: routes come from dynamic.yml only, so the proxy
# never needs docker.sock. The dashboard and API stay off.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
    transport:
      respondingTimeouts:
        readTimeout: 60s
        idleTimeout: 180s

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: false

certificatesResolvers:
  le:
    acme:
      storage: /acme/acme.json
      tlsChallenge: {}

api:
  dashboard: false
  insecure: false

log:
  level: INFO

# Access log on stdout, rotated by Docker (harden.sh: 5 x 20 MB per container).
# The privacy policy says these logs keep no user IP: client address fields and all
# headers (cf-connecting-ip, x-forwarded-for) are dropped; Traefik drops fields only in json format.
# Rate limiting reads the rate_limits table, not this log.
accessLog:
  format: json
  fields:
    names:
      ClientAddr: drop
      ClientHost: drop
      ClientPort: drop
    headers:
      defaultMode: drop
