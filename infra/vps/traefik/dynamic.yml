# Dynamic config. Host names come from the proxy container's AI_HOST (push-bot), AGENT_HOST
# (push-agent) and DISPATCH_HOST through Traefik's Go templating, so this file holds no
# deployment values.
http:
  routers:
    bot:
      rule: 'Host(`{{ env "AI_HOST" }}`)'
      entryPoints: [websecure]
      service: bot
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
    # Only when the proxy has a host for it; without one push-agent is reached by its queue alone.
{{- if env "AGENT_HOST" }}
    agent:
      rule: 'Host(`{{ env "AGENT_HOST" }}`)'
      entryPoints: [websecure]
      service: agent
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
{{- end }}
    dispatch:
      rule: 'Host(`{{ env "DISPATCH_HOST" }}`)'
      entryPoints: [websecure]
      service: dispatch
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
    # Test server (compose.staging.yaml). Only when the proxy has the staging hosts.
{{- if env "STAGING_AI_HOST" }}
    staging-bot:
      rule: 'Host(`{{ env "STAGING_AI_HOST" }}`)'
      entryPoints: [websecure]
      service: staging-bot
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
    staging-dispatch:
      rule: 'Host(`{{ env "STAGING_DISPATCH_HOST" }}`)'
      entryPoints: [websecure]
      service: staging-dispatch
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
{{- end }}
{{- if env "STAGING_AGENT_HOST" }}
    staging-agent:
      rule: 'Host(`{{ env "STAGING_AGENT_HOST" }}`)'
      entryPoints: [websecure]
      service: staging-agent
      middlewares: [security-headers, rate-limit]
      tls:
        certResolver: le
{{- end }}

  services:
    staging-bot:
      loadBalancer:
        servers:
          - url: http://staging-push-bot:8080
    staging-agent:
      loadBalancer:
        servers:
          - url: http://staging-push-agent:8080
    staging-dispatch:
      loadBalancer:
        servers:
          - url: http://staging-dispatcher:8091
    bot:
      loadBalancer:
        servers:
          - url: http://push-bot:8080
    agent:
      loadBalancer:
        servers:
          - url: http://push-agent:8080
    dispatch:
      loadBalancer:
        servers:
          - url: http://dispatcher:8091

  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
    # Per client IP. Callers are Cloudflare Workers, which share egress IPs, so the limit
    # is set to stop a single-source flood, not to meter users (the gateway does that).
    rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
