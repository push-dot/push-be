# Hostinger KVM 2 (2 vCPU / 8 GB), bootstrapped by harden.sh. No panel, no docker.sock.
# Traefik in this file terminates TLS for ${AI_HOST} and ${DISPATCH_HOST}; it is the
# only service with published ports (80, 443). Everything else stays on internal networks.
# This file does not run Postgres: DATABASE_URL points at Neon. Migrations stay manual
# (RUN_MIGRATIONS=0).
# QUEUE_BACKEND=redis runs AI jobs in ai-worker from Redis Streams.
# QUEUE_BACKEND=postgres rolls back to the in-process FOR UPDATE SKIP LOCKED poller (also in ai-worker).
# Do not set CF_WORKER or CHAT_EXECUTOR=workflow on this host.
# Memory: limits sum to 5,184 MB (tmpfs counts against each limit). The table is in README.md.
# bin/check-compose rejects docker.sock, privileged, host namespaces and Dokploy in the
# rendered config; CI and the VPS deploy both run it. Every image is pinned by digest
# (check-compose rejects a bare tag); Dependabot proposes bumps.

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-ai-image: &ai-image
  <<: *hardened
  build:
    context: ../../services/ai
    dockerfile: Dockerfile
  image: push-ai:local
  user: "10001:10001"
  pids_limit: 512
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /home/app:size=64m,uid=10001,gid=10001,mode=0700

x-queue-env: &queue-env
  APP_ENV: production
  DB_DRIVER: asyncpg
  PG_TRANSPORT: tcp
  RUN_MIGRATIONS: "0"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0

x-ai-env: &ai-env
  <<: *queue-env
  PORT: "8080"
  STORAGE_DIR: /data/sources
  PUSH_RESUME_DIR: /data/resume
  CHAT_EXECUTOR: local
  BLOB_STORE: db
  CHECKPOINTER: postgres
  PLAYWRIGHT_NO_SANDBOX: "1"
  AI_SHARED_SECRET: ${AI_SHARED_SECRET:?AI_SHARED_SECRET is required}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_PRICE_ULTRA: ${STRIPE_PRICE_ULTRA:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-tei}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-openai/text-embedding-3-small}
  TEI_EMBED_URL: http://embed:80
  TEI_RERANK_URL: http://rerank:80
  RERANK_PROVIDER: ${RERANK_PROVIDER:-similarity}
  AI_HARNESS: ${AI_HARNESS:-}
  CORE_ORIGIN: ${CORE_ORIGIN:-}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}

services:
  # One-shot: hands the two volume roots whose images ship them root-owned to the
  # non-root users that write them. Only CAP_CHOWN, no network, then exits.
  volume-init:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    command: ["sh", "-c", "chown 65532:65532 /acme && chown 10001:10001 /tei"]
    volumes:
      - traefik-acme:/acme
      - tei-models:/tei

  proxy:
    <<: *hardened
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    user: "65532:65532"
    command: ["--configFile=/etc/traefik/traefik.yml"]
    mem_limit: 128m
    pids_limit: 128
    # Docker sets this already; stated so binding :80/:443 without CAP_NET_BIND_SERVICE is explicit.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      AI_HOST: ${AI_HOST:?AI_HOST is required}
      DISPATCH_HOST: ${DISPATCH_HOST:?DISPATCH_HOST is required}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    depends_on:
      volume-init:
        condition: service_completed_successfully
    networks:
      - edge

  dispatcher:
    <<: *ai-image
    command: ["python", "-m", "app.workers.dispatcher_main"]
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /home/app:size=8m,uid=10001,gid=10001,mode=0700
    environment:
      <<: *queue-env
      STORAGE_DIR: /data/sources
      DISPATCH_PORT: "8091"
      DISPATCH_SECRET: ${DISPATCH_SECRET:?DISPATCH_SECRET is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEON_STORAGE_LIMIT_BYTES: ${NEON_STORAGE_LIMIT_BYTES:-1073741824}
    volumes:
      - ai-data:/data:ro
    depends_on:
      - redis
    networks:
      - edge
      - push-internal
    expose:
      - "8091"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')
      interval: 30s
      timeout: 5s
      retries: 3

  # Runs the queue worker and, with SERVE_API=1, the temporary ai-api routes in one process.
  ai-worker:
    <<: *ai-image
    command: ["python", "-m", "app.workers.ai_worker_main"]
    mem_limit: 1280m
    shm_size: 128m
    environment:
      <<: *ai-env
      SERVE_API: "1"
      QUEUE_GROUP: ai
      QUEUE_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-3}
    volumes:
      - ai-data:/data
    depends_on:
      - redis
    networks:
      - edge
      - push-internal
    expose:
      - "8080"

  ingest-worker:
    <<: *ai-image
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.ingest_worker_main"]
    mem_limit: 512m
    environment:
      <<: *ai-env
      QUEUE_GROUP: ingest
      QUEUE_CONCURRENCY: ${INGEST_WORKER_CONCURRENCY:-2}
    volumes:
      - ai-data:/data:ro
    depends_on:
      - redis
      - embed
    networks:
      - push-internal

  notify-worker:
    <<: *ai-image
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.notify_worker_main"]
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /home/app:size=8m,uid=10001,gid=10001,mode=0700
    environment:
      <<: *queue-env
      QUEUE_GROUP: notify
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      - redis
    networks:
      - push-internal

  redis:
    <<: *hardened
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    # The image's entrypoint skips its chown/su-exec step when not started as root.
    user: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1 300 100"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    mem_limit: 192m
    pids_limit: 64
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - push-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  embed:
    <<: *hardened
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    user: "10001:10001"
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "32",
              "--max-batch-tokens", "2048", "--max-concurrent-requests", "8"]
    mem_limit: 2816m
    pids_limit: 256
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      HOME: /tmp
      HUGGINGFACE_HUB_CACHE: /data
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - tei-models:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    networks:
      - push-internal
    expose:
      - "80"

  # Off by default (RERANK_PROVIDER=similarity). Needs about 2.5 GB more than the budget:
  # start it only with EMBEDDING_PROVIDER=api (embed stopped) or on a larger VPS.
  rerank:
    <<: *hardened
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["rerank"]
    user: "10001:10001"
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--max-client-batch-size", "32",
              "--max-batch-tokens", "2048", "--max-concurrent-requests", "8"]
    mem_limit: 2816m
    pids_limit: 256
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      HOME: /tmp
      HUGGINGFACE_HUB_CACHE: /data
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - tei-models:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    networks:
      - push-internal
    expose:
      - "80"

volumes:
  ai-data:
  redis-data:
  tei-models:
  traefik-acme:

networks:
  # proxy <-> dispatcher, ai-worker. Needs outbound internet for ACME and the apps.
  edge:
    driver: bridge
  # Redis, embed and the workers. ingest/notify reach the internet through this bridge too
  # (Neon, Expo, link fetches); the host firewall limits that egress.
  push-internal:
    driver: bridge
