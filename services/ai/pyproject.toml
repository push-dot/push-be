[project]
name = "push-be"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.60",
    "pypdf>=5",
]

[project.optional-dependencies]
# Native extensions and a real browser. Used by `uvicorn` on a VM or laptop.
# Cloudflare Python Workers (Pyodide) cannot load these; the Workers runtime
# uses the Neon wire client, pure-Python AES-GCM, pypdf, and Browser Rendering.
local = [
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "cryptography>=43",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "opendataloader-pdf>=2.5.9,<3",
    "playwright>=1.63,<2",
    "reportlab>=4.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
