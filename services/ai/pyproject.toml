[project]
name = "push-be"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Workers (Pyodide) resolves its own langgraph: ormsgpack>=1.12 (langgraph>=1.2.17) has no Pyodide wheel.
    "langgraph>=0.2.60,<2",
    "pypdf>=5",
    "redis>=5",
]

[project.optional-dependencies]
# Native extensions and a real browser. Used by `uvicorn` on a VM or laptop.
# Cloudflare Python Workers (Pyodide) cannot load these; the Workers runtime
# uses the Neon wire client, pure-Python AES-GCM, pypdf, and Browser Rendering.
local = [
    "uvicorn[standard]>=0.54.0",
    "asyncpg>=0.30",
    "cryptography>=43",
    "langgraph>=1.2.17,<2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "opendataloader-pdf>=2.5.9,<3",
    "playwright>=1.63,<2",
    "reportlab>=4.0",
    "langchain-core>=1.7.0,<2",
    "langchain-openai>=1.7.2,<2",
    "llama-index-core>=0.12,<0.13",
    "llama-index-vector-stores-postgres>=0.4,<0.5",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "fakeredis>=2.26",
]
# scripts/migrate.py from CI: asyncpg for TCP, websockets for Neon wss://.
migrate = [
    "asyncpg>=0.30",
    "websockets>=13,<18",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
strict = true
warn_unreachable = true
# Most third-party packages here ship no stubs.
ignore_missing_imports = true
